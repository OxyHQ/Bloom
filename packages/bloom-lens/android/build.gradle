plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'so.oxy.bloom.glassmenu'
version = '0.1.0'

android {
  namespace "so.oxy.bloom.glassmenu"
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The glass engine, free of React Native (android-engine, linked by expo-module.config.json's projects).
  implementation project(':oxy.so-bloom-lens-engine')
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.customview:customview:1.1.0'
}
