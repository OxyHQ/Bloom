[package]
name = "bloomc"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "bloom"
path = "src/bin/bloom.rs"

[[bin]]
name = "bloomc"
path = "src/main.rs"

[dependencies]
bloom_fmt = { path = "../fmt" }
bloom_lang = { path = "../lang" }
bloom_migrate = { path = "../migrate" }
bloom_language_compiler = { path = "../compiler" }
oxc_sourcemap = { workspace = true }

