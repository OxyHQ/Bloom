[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { name = "Oxy" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Bloom, the language by Oxy: a tree-sitter grammar for .bloom files"
keywords = [ "incremental", "parsing", "tree-sitter", "bloom" ]
license.text = "SEE LICENSE IN LICENSE"
name = "tree-sitter-bloom"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/OxyHQ/Bloom/tree/main/packages/tree-sitter-bloom"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
