name: Validate Bloom

on:
  pull_request:
  # main lands through a merge queue whose one required check is `CI complete`.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match scripts/native-check/build.gradle (React Native 0.88's own NDK).
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.30.5
  # The SDK packages the Android gates compile against, cached by name.
  # build-tools;36.0.0 is Android Gradle Plugin 9.2's default, which it
  # otherwise downloads itself in the middle of the build.
  ANDROID_SDK_CURRENT: platforms;android-36 platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0
  ANDROID_SDK_MINIMUM: platforms;android-34 build-tools;33.0.1 build-tools;34.0.0

concurrency:
  group: bloom-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Has the full suite already run on this exact tree? On a push to main that
  # came through the merge queue it has: the queue tested THIS SHA in its
  # merge_group run and fast-forwarded main to it only after `CI complete` went
  # green. Re-running build + every shard on push re-tested an identical tree,
  # and the org is on GitHub's free plan (20 concurrent jobs across ALL repos),
  # so the second run was paid for in every other repo's queue time.
  #
  # So a queue-verified push runs only this job and `CI complete`, which
  # accepts the heavy jobs as skipped ONLY when this job says verified. Every
  # other push (direct push, the queue switched off) and every dispatch runs
  # the full suite, because this job answers nothing for them. Skipped outright
  # on pull_request and merge_group, where it costs no runner slot.
  #
  # An unanswerable question means RUN EVERYTHING: the step is
  # continue-on-error, an API failure leaves `verified` unset, and unset is
  # not 'true'. Ported from OxyHQ/Mention's ci.yml `provenance` job.
  provenance:
    name: Merge-queue provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Did this exact commit pass Validate Bloom in the merge queue?
        id: verified
        continue-on-error: true
        env:
          VERIFY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/merge-queue-verified.sh

  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true. Unset,
  # every job runs hosted as before and none of the race's jobs takes a runner.
  # Set, the raced jobs (build, language, language-parity, tests) run on the
  # self-hosted seldon-ci pool; a lane still queued 3 minutes after it was
  # created gets a hosted twin of the same name (the `-hosted` jobs), the lane
  # that starts first wins, and race-finish cancels the other through its
  # job-level concurrency group. A fork's pull request never runs on Seldon.
  # Pull requests and the merge queue only, never a push: the release trusts a
  # push run that concluded `success`, and a cancelled loser would make it
  # conclude `cancelled`.
  # A Seldon lane that fails, whatever the reason (the house network drops new
  # connections in bursts), reruns hosted in its `-rescue` job, which fails
  # again on a genuine failure. CI complete takes the raced jobs' verdict from
  # the race, so neither a cancelled loser nor a rescued lane is a red.
  race:
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event (provenance, a twin) must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read

  build:
    name: Build, package and types
    needs: provenance
    # Every heavy job carries this condition. `!cancelled()` because a
    # dependency on a SKIPPED job (every pull_request, merge_group and
    # dispatch run) would otherwise skip the dependent too; it runs unless
    # provenance positively answered verified.
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    # Each raced lane: Seldon when the race is on (never for a fork), its own
    # concurrency group (the race cancels a loser by queuing into it; the name
    # must be the job's display name), and the guard as its first step.
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions: &race-lane-permissions
      contents: read
      actions: read
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Build, package and types
    steps: &build-steps # A lane that starts after its twin waits here to be cancelled.
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before this one is the base the changelog check diffs
          # against: a pull request's merge commit, a merge-queue entry and a
          # squash pushed to main each have it as their first parent.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      # A change records its changelog entry as a fragment in changes/; only a
      # release (its package's version bumped) edits a CHANGELOG.md
      # (scripts/changelog.mjs, docs/releasing.mdx).
      - name: Changelog fragments, and no CHANGELOG edit outside a release
        run: |
          node --test scripts/test-changelog.mjs
          node scripts/changelog.mjs check
      - run: bun install --frozen-lockfile --ignore-scripts
      # Biome formatting + lint (config: biome.json), before the slower build.
      # Call the installed binary by path: a bare `bunx biome` that misses the
      # local install fetches npm's unrelated `biome` package, which lints nothing.
      - run: ./node_modules/.bin/biome ci .
      # Includes prebuild generation and postbuild tarball/freshness checks.
      - run: bun run build
      - name: Verify packed chart card consumer entries
        run: node scripts/verify-chart-card-entries.mjs
      - run: bun run typescript
      # The separately published workspace packages build, typecheck and test
      # in dependency order (the root jest config ignores packages/). This
      # gates their release; the release itself runs no tests. The language
      # packages have their own job (`language`).
      - name: Workspace package builds, typecheck and test
        run: |
          for package in packages/bloom-text packages/bloom-editor; do
            (cd "$package" && bun run build && bun run typescript && bun run test)
          done
      # The built `@oxy.so/bloom/color-engine` subpath, as a server loads it:
      # Bun, Node ESM, Node CommonJS and a node16 typecheck, pulling no React.
      - name: Colour engine subpath
        run: node --test scripts/test-color-engine-subpath.mjs
      # bunfig.toml exempts every first-party package from the install
      # quarantine by exact name (see scripts/check-release-age-excludes.mjs).
      - name: First-party packages are exempt from the install quarantine
        run: |
          node --test scripts/test-check-release-age-excludes.mjs
          node scripts/check-release-age-excludes.mjs
      - name: Offline avatar extraction source units
        run: |
          mkdir -p .local
          node --test --test-concurrency=2 \
            scripts/test-avatar-async-pixels.mjs \
            scripts/test-avatar-controller.mjs \
            scripts/test-avatar-index-buffer.mjs \
            scripts/test-avatar-joint-uniform.mjs \
            scripts/test-avatar-motion-transport.mjs \
            scripts/test-avatar-pose-sharing.mjs \
            scripts/test-avatar-surface-transport.mjs \
            scripts/test-avatar-webgpu-presenter.mjs \
            scripts/test-procedural-avatar-shapes.mjs
      # Packed vector assets are lossless and content-addressed; the manifest, the package
      # gate and the byte budgets keep the catalog from growing back (docs/agent-avatar.mdx).
      - name: Avatar vector packing and bundle budgets
        run: |
          node --test scripts/test-avatar-vector-pack.mjs \
            scripts/test-avatar-vector-compaction.mjs scripts/test-avatar-vector-package.mjs
          node scripts/verify-avatar-bundle-size.mjs
      - name: Generated sources are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  # build's hosted twin in the Seldon race: the same name, strategy and steps.
  build-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Build, package and types' || 'Build, package and types (seldon twin, off)' }}
    needs: race
    # `!cancelled()`: an ancestor skipped on this event (provenance, a twin) must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Build, package and types
    steps: *build-steps

  # build's rescue: reruns it hosted when a Seldon lane of it failed.
  build-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Build, package and types' || 'Build, package and types (seldon rescue, off)' }}
    needs: [provenance, build]
    if: ${{ !cancelled() && needs.build.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *race-lane-permissions
    steps: *build-steps

  # The language packages: the language (its unit suite; its parity suite runs
  # in `language-parity`), the compiler (Rust, its adapters and its own parity
  # suite), Bloom data and the className codemod (its transform, and its sample
  # app's corpus proven before and after, native and web). Their suites outgrow
  # the build job's budget, so they run beside it.
  language:
    name: Language packages
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: *seldon-lane
    timeout-minutes: 45
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Language packages
    steps: &language-steps
      - *race-guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # The language builds and typechecks against Bloom's built package.
      - run: bun run build
      # The language compiler is Rust (Oxc needs 1.97+). Pinned, so a new
      # stable never changes what CI builds; rustup ships with the runner
      # (hosted and seldon-ci both).
      - name: Rust toolchain for the language compiler
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
      # Cargo has no stable minimum-release-age, so the lockfile is audited
      # against the same 7-day quarantine bunfig.toml applies to npm.
      - name: Language compiler crates are past the quarantine
        run: cd packages/bloom-language-compiler && bun run audit:crates
      - name: Language compiler Rust format and lint
        run: cd packages/bloom-language-compiler && bun run lint:rust
      # The language packages build, typecheck and test in dependency order.
      # This gates their release; the release itself runs no tests. The compiler's
      # test runs its Rust tests, its adapters and the parity suite (every
      # fixture rendered interpreted and compiled, native and web); the
      # language's checks that the spec's generated outputs are current.
      # The compiler's tests load the addon built from this checkout
      # (`build:addon`); it has no `build`, so the release builds no Rust and
      # ships the addons of its platform packages instead.
      - name: Language package builds, typecheck and test
        run: |
          (cd packages/bloom-language-compiler && bun run build:addon)
          (cd packages/bloom-language && bun run build && bun run typescript && bun run test:unit)
          for package in packages/bloom-language-compiler packages/bloom-data packages/bloom-language-codemod; do
            (cd "$package" && bun run --if-present build && bun run typescript && bun run test)
          done
      # The VS Code extension's .bloom grammar against its scope fixtures, run
      # through vscode-textmate, the engine VS Code uses.
      - name: Bloom VS Code grammar
        run: cd packages/bloom-vscode && bun run test
      # The extension as an installable .vsix, kept as this run's artifact
      # (Extensions: Install from VSIX...). It is not published to a marketplace.
      - name: Package the Bloom VS Code extension
        run: cd packages/bloom-vscode && bun run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bloom-vscode-vsix
          path: packages/bloom-vscode/bloom-vscode.vsix
          if-no-files-found: error
      # The language's web weight: the root reaches no family of nodes, and stays
      # within its budget; each family is an entry an app pays for by importing it.
      - name: Language bundle weight
        run: cd packages/bloom-language && bun run verify:bundle
      # The codemod as an app installs it: packed as the release packs it, with
      # the language, installed outside the repository, run on Node.
      - name: Codemod CLI runs from its packed tarball
        run: packages/bloom-language-codemod/scripts/verify-packed-cli.sh
      # The codemod's corpus is what its CLI writes for its sample app: rewritten
      # here, so a transform change that alters it fails the step below.
      - name: Codemod corpus is current
        run: cd packages/bloom-language-codemod && bun run corpus
      # The language guides' `check` examples (getting started, the tour, from
      # JSX, the agents' cheat sheet) through the compiler's addon built above and
      # TypeScript, so a guide never teaches code that does not build. The
      # generated reference's freshness is the language's own test above.
      - name: Language guide examples compile
        run: cd packages/bloom-language && bun run check:docs
      - name: Generated sources are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  language-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Language packages' || 'Language packages (seldon twin, off)' }}
    needs: race
    # `!cancelled()`: an ancestor skipped on this event (provenance, a twin) must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Language packages
    steps: *language-steps

  # language's rescue: reruns it hosted when a Seldon lane of it failed.
  language-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'Language packages' || 'Language packages (seldon rescue, off)' }}
    needs: [provenance, language]
    if: ${{ !cancelled() && needs.language.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *race-lane-permissions
    steps: *language-steps

  # The language's parity suite: every family rendered as the language and as
  # hand-written Bloom, native and web, light and dark. Alone it takes about
  # half an hour, so it runs in two shards beside the other language packages.
  # The shard list and the `/2` denominator (name + --shard) must agree, or
  # jest silently runs only part of the suite.
  language-parity:
    name: Language parity (${{ matrix.shard }}/2)
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: *seldon-lane
    timeout-minutes: 35
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Language parity (${{ matrix.shard }}/2)
    strategy: &language-parity-strategy
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps: &language-parity-steps
      - *race-guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # The suite renders Bloom from its source, beside the outputs its build generates.
      - run: bun run build
      - name: Language parity suite
        run: cd packages/bloom-language && bun run test:parity --shard=${{ matrix.shard }}/2

  language-parity-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && format('Language parity ({0}/2)', matrix.shard) || format('Language parity ({0}/2) (seldon twin, off)', matrix.shard) }}
    needs: race
    # `!cancelled()`: an ancestor skipped on this event (provenance, a twin) must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Language parity (${{ matrix.shard }}/2)
    strategy: *language-parity-strategy
    steps: *language-parity-steps

  # language-parity's rescue: reruns it hosted when a Seldon lane of it failed.
  language-parity-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && format('Language parity ({0}/2)', matrix.shard) || format('Language parity ({0}/2) (seldon rescue, off)', matrix.shard) }}
    needs: [provenance, language-parity]
    if: ${{ !cancelled() && needs.language-parity.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: *race-lane-permissions
    strategy: *language-parity-strategy
    steps: *language-parity-steps

  # The shard list and the `/5` denominator (name + --shard) must agree, or
  # jest silently runs only part of the suite.
  tests:
    name: Tests (${{ matrix.shard }}/5)
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: *seldon-lane
    timeout-minutes: 20
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Tests (${{ matrix.shard }}/5)
    strategy: &tests-strategy
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps: &tests-steps
      - *race-guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Keep the runtime/Intl data aligned with the build. --no-opt mitigates
      # the documented V8 contextify crashes; it cannot go in NODE_OPTIONS.
      # Five shards x four workers (the runner's 4 vCPU) keeps suites per
      # worker at or below the old nine x two: the crash grows with files per
      # worker and with FEWER workers, not with memory (AGENTS.md).
      - run: node --no-opt node_modules/jest/bin/jest.js --watchman=false --maxWorkers=4 --shard=${{ matrix.shard }}/5

  tests-hosted:
    name: ${{ vars.CI_SELDON_RACE == 'true' && format('Tests ({0}/5)', matrix.shard) || format('Tests ({0}/5) (seldon twin, off)', matrix.shard) }}
    needs: race
    # `!cancelled()`: an ancestor skipped on this event (provenance, a twin) must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *race-lane-permissions
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Tests (${{ matrix.shard }}/5)
    strategy: *tests-strategy
    steps: *tests-steps

  # tests's rescue: reruns it hosted when a Seldon lane of it failed.
  tests-rescue:
    name: ${{ vars.CI_SELDON_RACE == 'true' && format('Tests ({0}/5)', matrix.shard) || format('Tests ({0}/5) (seldon rescue, off)', matrix.shard) }}
    needs: [provenance, tests]
    if: ${{ !cancelled() && needs.tests.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *race-lane-permissions
    strategy: *tests-strategy
    steps: *tests-steps

  # The Android gates, one variant each. Their steps are the local action
  # .github/actions/android-native-check, which gradle-dependency-cache below
  # runs too. Gradle's dependency cache (~/.gradle/caches/modules-2) is restored
  # from main, where that job saves it: this job never runs on a queue-verified
  # push, so nothing it saved would ever reach the scope every pull request and
  # merge-queue run restores from, and every run re-downloaded every dependency
  # from Maven Central until it rate-limited the runners (429, run 45512013388).
  # When the key misses, the newest older entry (its prefix) restores, so only
  # what changed downloads.
  android:
    name: Android (${{ matrix.variant }})
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, default, predictive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle dependency cache entry
        id: gradle-cache
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/gradle-dependency-cache.sh "$VARIANT" >> "$GITHUB_OUTPUT"
      - name: Restore Gradle's dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gradle-cache.outputs.path }}
          key: ${{ steps.gradle-cache.outputs.key }}
          restore-keys: ${{ steps.gradle-cache.outputs.restore-prefix }}
      - uses: ./.github/actions/android-native-check
        with:
          variant: ${{ matrix.variant }}
          gradle-version: ${{ steps.gradle-cache.outputs.gradle-version }}

  # Keeps each Android variant's Gradle dependency cache in main's Actions
  # cache, as Warm Android caches below does for the SDK, NDK and Robolectric:
  # when main has no entry under the variant's current key, it runs that
  # variant's gate (a real resolution of every artifact the gate needs) from an
  # empty cache and saves what Gradle downloaded. A cache warmer, not a gate.
  gradle-dependency-cache:
    name: Warm Gradle caches (${{ matrix.variant }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, default, predictive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle dependency cache entry
        id: gradle-cache
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/gradle-dependency-cache.sh "$VARIANT" >> "$GITHUB_OUTPUT"
      - name: Is it already cached?
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gradle-cache.outputs.path }}
          key: ${{ steps.gradle-cache.outputs.key }}
          lookup-only: true
      - name: Resolve it with the variant's gate
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/android-native-check
        with:
          variant: ${{ matrix.variant }}
          gradle-version: ${{ steps.gradle-cache.outputs.gradle-version }}
      # Stop the daemon that holds the cache open, and drop its process lock.
      - name: Settle the cache for saving
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          gradle --stop
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties
      - name: Save it
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gradle-cache.outputs.path }}
          key: ${{ steps.gradle-cache.outputs.key }}

  # Keeps what the android job downloads in main's Actions cache, the one scope
  # every pull request and merge-queue run can restore from: the predictive
  # gate's NDK and CMake, each variant's SDK packages and Robolectric's
  # runtimes. The android job itself never runs on a queue-verified push, so
  # without this nothing would ever save them there and every run would
  # re-download them (~700 MB of NDK alone), from hosts that time out and
  # rate-limit shared runners. A cache warmer, not a gate: a miss downstream
  # installs or fetches directly, with retries.
  native-toolchain-cache:
    name: Warm Android caches
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cache: [native, sdk-current, sdk-minimum, robolectric]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      # The same SDK root as android-native-check, which restores these
      # entries: their paths are under it.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902' # 22.0; understands API 37.0 package versions
      - name: What this entry holds
        id: entry
        env:
          CACHE: ${{ matrix.cache }}
        run: |
          case "$CACHE" in
            native) bash .github/scripts/android-sdk-cache.sh "ndk;${ANDROID_NDK_VERSION} cmake;${ANDROID_CMAKE_VERSION}" ;;
            sdk-current) bash .github/scripts/android-sdk-cache.sh "${ANDROID_SDK_CURRENT}" ;;
            sdk-minimum) bash .github/scripts/android-sdk-cache.sh "${ANDROID_SDK_MINIMUM}" ;;
            robolectric)
              echo "key=$(python3 .github/scripts/verified-android-downloads.py robolectric-key --directory .)"
              # The same literal as the restore in android-native-check: the cache
              # version hashes the path as written, so `$HOME/...` saved an
              # entry `~/...` never restored and every job downloaded ~420 MB
              # from Maven Central, which then rate-limited the runners.
              echo 'paths=~/.m2/repository/org/robolectric/android-all-instrumented'
              ;;
          esac >> "$GITHUB_OUTPUT"
      - name: Is it already cached?
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.entry.outputs.paths }}
          key: ${{ steps.entry.outputs.key }}
          lookup-only: true
      - name: Install the SDK packages
        if: steps.lookup.outputs.cache-hit != 'true' && matrix.cache != 'robolectric'
        env:
          PACKAGES: ${{ steps.entry.outputs.packages }}
        # Word splitting is the package list.
        run: bash .github/scripts/install-android-sdk-packages.sh $PACKAGES
      - name: Fetch the verified Robolectric runtimes
        if: steps.lookup.outputs.cache-hit != 'true' && matrix.cache == 'robolectric'
        run: python3 .github/scripts/verified-android-downloads.py robolectric --directory ~/.m2/repository
      - name: Save it
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.entry.outputs.paths }}
          key: ${{ steps.entry.outputs.key }}

  # The one required check of the main merge queue: green only when every job
  # above is, so a skipped or cancelled shard can never read as a pass. The ONE
  # legitimate skip is a push whose exact SHA already passed this job in the
  # merge queue (provenance verified) — and then the heavy jobs MUST be
  # skipped, so a gating bug that ran them anyway is a red too. When the Seldon
  # race or a rescue ran, a raced job passes when the race's verdict says each
  # of its names passed in some lane and failed in no hosted lane: the loser's
  # cancellation makes the job's own result `cancelled`, and a Seldon lane that
  # failed on the network is excused by its rescue's success. It does not need
  # race-finish, whose reapers only follow the cancellation.
  ci-complete:
    name: CI complete
    if: always()
    needs:
      [
        provenance,
        race,
        build,
        build-hosted,
        build-rescue,
        language,
        language-hosted,
        language-rescue,
        language-parity,
        language-parity-hosted,
        language-parity-rescue,
        tests,
        tests-hosted,
        tests-rescue,
        android,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          RACED: ${{ needs.race.outputs.race }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()

          # Provenance runs on push and nowhere else. On push it must SUCCEED:
          # its step is continue-on-error, so even an unanswerable API call
          # leaves the job green with `verified` unset.
          provenance="$(jq -r '.provenance.result' <<<"$RESULTS")"
          verified="$(jq -r '.provenance.outputs.verified // ""' <<<"$RESULTS")"
          if [ "$EVENT_NAME" = push ]; then
            [ "$provenance" = success ] || failures+=("provenance did not pass on push: $provenance")
          else
            [ "$provenance" = skipped ] || failures+=("provenance ran on $EVENT_NAME: $provenance")
            verified=
          fi

          for job in build language language-parity tests android; do
            result="$(jq -r --arg job "$job" '.[$job].result' <<<"$RESULTS")"
            case "$job" in
              build | language | language-parity | tests)
                twin="$(jq -r --arg job "$job-hosted" '.[$job].result' <<<"$RESULTS")"
                rescue="$(jq -r --arg job "$job-rescue" '.[$job].result' <<<"$RESULTS")"
                # The family {job, job-hosted, job-rescue} stands on the race's
                # verdict when the race or the rescue ran; otherwise the job is
                # judged alone and its twin and rescue must not have run.
                if [ "$RACED" = true ] || [ "$rescue" != skipped ]; then
                  result="$RACE_VERDICT"
                else
                  [ "$twin" = skipped ] || failures+=("$job-hosted ran although the race did not: $twin")
                fi
                ;;
            esac
            if [ "$verified" = true ]; then
              [ "$result" = skipped ] || failures+=("$job ran on a queue-verified push: $result")
            elif [ "$result" != success ]; then
              failures+=("$job did not pass: $result")
            fi
          done

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          if [ "$verified" = true ]; then
            echo "::notice::${GITHUB_SHA} passed CI complete in the merge queue on this exact tree; build and tests were not re-run."
          else
            echo 'Every job passed.'
          fi
