name: Validate Bloom

on:
  pull_request:
  # main lands through a merge queue whose one required check is `CI complete`.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match scripts/native-check/build.gradle (React Native 0.88's own NDK).
  ANDROID_NDK_VERSION: 27.1.12297006
  ANDROID_CMAKE_VERSION: 3.30.5

concurrency:
  group: bloom-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Has the full suite already run on this exact tree? On a push to main that
  # came through the merge queue it has: the queue tested THIS SHA in its
  # merge_group run and fast-forwarded main to it only after `CI complete` went
  # green. Re-running build + every shard on push re-tested an identical tree,
  # and the org is on GitHub's free plan (20 concurrent jobs across ALL repos),
  # so the second run was paid for in every other repo's queue time.
  #
  # So a queue-verified push runs only this job and `CI complete`, which
  # accepts the heavy jobs as skipped ONLY when this job says verified. Every
  # other push (direct push, the queue switched off) and every dispatch runs
  # the full suite, because this job answers nothing for them. Skipped outright
  # on pull_request and merge_group, where it costs no runner slot.
  #
  # An unanswerable question means RUN EVERYTHING: the step is
  # continue-on-error, an API failure leaves `verified` unset, and unset is
  # not 'true'. Ported from OxyHQ/Mention's ci.yml `provenance` job.
  provenance:
    name: Merge-queue provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Did this exact commit pass Validate Bloom in the merge queue?
        id: verified
        continue-on-error: true
        env:
          VERIFY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/merge-queue-verified.sh

  build:
    name: Build, package and types
    needs: provenance
    # Every heavy job carries this condition. `!cancelled()` because a
    # dependency on a SKIPPED job (every pull_request, merge_group and
    # dispatch run) would otherwise skip the dependent too; it runs unless
    # provenance positively answered verified.
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Biome formatting + lint (config: biome.json), before the slower build.
      # Call the installed binary by path: a bare `bunx biome` that misses the
      # local install fetches npm's unrelated `biome` package, which lints nothing.
      - run: ./node_modules/.bin/biome ci .
      # Includes prebuild generation and postbuild tarball/freshness checks.
      - run: bun run build
      - name: Verify packed chart card consumer entries
        run: node scripts/verify-chart-card-entries.mjs
      - run: bun run typescript
      # The separately published workspace packages build, typecheck and test
      # in dependency order (the root jest config ignores packages/). This
      # gates their release; the release itself runs no tests.
      - name: Workspace package builds, typecheck and test
        run: |
          for package in packages/bloom-text packages/bloom-editor; do
            (cd "$package" && bun run build && bun run typescript && bun run test)
          done
      # The built `@oxy.so/bloom/color-engine` subpath, as a server loads it:
      # Bun, Node ESM, Node CommonJS and a node16 typecheck, pulling no React.
      - name: Colour engine subpath
        run: node --test scripts/test-color-engine-subpath.mjs
      - name: Offline avatar extraction source units
        run: |
          mkdir -p .local
          node --test --test-concurrency=2 \
            scripts/test-avatar-async-pixels.mjs \
            scripts/test-avatar-controller.mjs \
            scripts/test-avatar-index-buffer.mjs \
            scripts/test-avatar-joint-uniform.mjs \
            scripts/test-avatar-motion-transport.mjs \
            scripts/test-avatar-pose-sharing.mjs \
            scripts/test-avatar-surface-transport.mjs \
            scripts/test-avatar-webgpu-presenter.mjs \
            scripts/test-procedural-avatar-shapes.mjs
      # Packed vector assets are lossless and content-addressed; the manifest, the package
      # gate and the byte budgets keep the catalog from growing back (docs/agent-avatar.mdx).
      - name: Avatar vector packing and bundle budgets
        run: |
          node --test scripts/test-avatar-vector-pack.mjs \
            scripts/test-avatar-vector-compaction.mjs scripts/test-avatar-vector-package.mjs
          node scripts/verify-avatar-bundle-size.mjs
      - name: Generated sources are committed
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  # The shard list and the `/5` denominator (name + --shard) must agree, or
  # jest silently runs only part of the suite.
  tests:
    name: Tests (${{ matrix.shard }}/5)
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Keep the runtime/Intl data aligned with the build. --no-opt mitigates
      # the documented V8 contextify crashes; it cannot go in NODE_OPTIONS.
      # Five shards x four workers (the runner's 4 vCPU) keeps suites per
      # worker at or below the old nine x two: the crash grows with files per
      # worker and with FEWER workers, not with memory (AGENTS.md).
      - run: node --no-opt node_modules/jest/bin/jest.js --watchman=false --maxWorkers=4 --shard=${{ matrix.shard }}/5

  android:
    name: Android (${{ matrix.variant }})
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, default, predictive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The legacy SDK "tools" package was removed from the repository.
          packages: platform-tools
          cmdline-tools-version: '15859902' # 22.0; understands API 37.0 package versions
      - name: Verify official Android download fallback
        run: python3 .github/scripts/test-verified-android-downloads.py
      - name: Prepare the exact verified Gradle distribution
        env:
          GRADLE_VERSION: ${{ matrix.variant == 'legacy' && '8.3' || '9.4.1' }}
        run: python3 .github/scripts/verified-android-downloads.py gradle --version "$GRADLE_VERSION" --directory "$RUNNER_TEMP/bloom-verified-gradle"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ matrix.variant == 'legacy' && '8.3' || '9.4.1' }}
      - name: Prepare verified Kotlin transport fallback when required
        if: matrix.variant != 'legacy'
        run: python3 .github/scripts/verified-android-downloads.py kotlin --version 2.2.0 --directory "$RUNNER_TEMP/bloom-verified-kotlin"

      - name: Prepare verified root Kotlin transport when required
        if: matrix.variant != 'legacy'
        run: python3 .github/scripts/verified-android-downloads.py kotlin --version 2.2.21 --directory "$RUNNER_TEMP/bloom-verified-kotlin"
      - name: Prepare verified ReactAndroid Kotlin transport when required
        if: matrix.variant == 'predictive'
        run: python3 .github/scripts/verified-android-downloads.py kotlin --version 2.2.10 --directory "$RUNNER_TEMP/bloom-verified-kotlin"

      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Current Android SDK
        if: matrix.variant != 'legacy'
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0'
      # Only predictive compiles native code (React Native and Hermes from
      # source); Bloom's own Android library has no native build.
      - name: The cached NDK is the one the fixture builds with
        if: matrix.variant == 'predictive'
        run: grep -qxF "  ndkVersion = '${ANDROID_NDK_VERSION}'" scripts/native-check/build.gradle
      - name: Restore NDK and CMake
        id: native-toolchain
        if: matrix.variant == 'predictive'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-native-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}
      - name: Install NDK and CMake
        if: matrix.variant == 'predictive' && steps.native-toolchain.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-android-native-toolchain.sh
      - name: Declared minimum React Native toolchain SDK
        if: matrix.variant == 'legacy'
        run: sdkmanager 'platforms;android-34' 'build-tools;33.0.1' 'build-tools;34.0.0'
      - name: Prepare verified Hermes source transport when required
        if: matrix.variant == 'predictive'
        run: python3 .github/scripts/verified-android-downloads.py hermes --react-native node_modules/react-native --directory "$RUNNER_TEMP/bloom-verified-hermes"
      - name: Hermes source prerequisites
        if: matrix.variant == 'predictive'
        run: |
          if dpkg-query -W -f='${Status}\n' libicu-dev 2>/dev/null | grep -qx 'install ok installed'; then
            echo 'The runner already provides the ICU development files.'
          else
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libicu-dev
          fi
      - name: Apply exact public API source backport
        if: matrix.variant == 'predictive'
        run: |
          echo '16b6577b14184ca971fb19692930ab85936103880bf42ccbaafce8e93ccf0a51  scripts/native-check/patches/react-native-0.88.0.patch' | sha256sum -c -
          patch --batch --forward --fuzz=0 -p1 -d node_modules/react-native < scripts/native-check/patches/react-native-0.88.0.patch
          echo '5b4e3d2eb483c5c4fca1b96abf17f11eabef45aa572b08b38bdd9df80670daf0  scripts/native-check/patches/react-native-screens-4.30.0.patch' | sha256sum -c -
          patch --batch --forward --fuzz=0 -p1 -d node_modules/react-native-screens < scripts/native-check/patches/react-native-screens-4.30.0.patch
      - name: Verify public build capability contract
        if: matrix.variant == 'default'
        run: python3 scripts/native-check/test-capability-contract.py
      - name: Compile production native source and run AndroidX callback tests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = legacy ]; then
            gradle -p scripts/native-check/legacy :bloom:compileDebugKotlin :bloom:processDebugManifest --console=plain --max-workers=2
            python3 scripts/native-check/legacy/verify-manifest.py
          else
            if [ "$VARIANT" = predictive ]; then
              gradle -p scripts/native-check -Pbloom.predictiveBackEnabled=true -Prnscreens.nativeBackOwnershipEnabled=true :bloom:testDebugUnitTest :screensWithCustomAutolinkName:compileDebugKotlin :screensWithCustomAutolinkName:compileDebugJavaWithJavac --console=plain --max-workers=2
            else
              gradle -p scripts/native-check :bloom:testDebugUnitTest --console=plain --max-workers=2
            fi
          fi

      - name: Prove unresolved-target host regression coverage
        if: matrix.variant == 'predictive'
        run: python3 scripts/native-check/verify-host-regression.py
      - name: Remove temporary Hermes source
        if: always() && matrix.variant == 'predictive'
        run: python3 .github/scripts/verified-android-downloads.py cleanup-hermes --directory "$RUNNER_TEMP/bloom-verified-hermes"
      - name: Remove temporary artifact repository before Gradle cache cleanup
        if: always()
        run: python3 .github/scripts/verified-android-downloads.py cleanup --directory "$RUNNER_TEMP/bloom-verified-kotlin"

  # Keeps the predictive gate's NDK and CMake in main's Actions cache, the one
  # scope every pull request and merge-queue run can restore from. The android
  # job itself never runs on a queue-verified push, so without this nothing
  # would ever save the cache there and every run would re-download ~700 MB.
  # A cache warmer, not a gate: a miss downstream installs it directly.
  native-toolchain-cache:
    name: Warm Android NDK cache
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          cmdline-tools-version: '15859902' # 22.0; understands API 37.0 package versions
      - name: Is the toolchain already cached?
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-native-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}
          lookup-only: true
      - name: Install NDK and CMake
        if: steps.lookup.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-android-native-toolchain.sh
      - name: Save NDK and CMake
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-native-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}

  # The one required check of the main merge queue: green only when every job
  # above is, so a skipped or cancelled shard can never read as a pass. The ONE
  # legitimate skip is a push whose exact SHA already passed this job in the
  # merge queue (provenance verified) — and then the heavy jobs MUST be
  # skipped, so a gating bug that ran them anyway is a red too.
  ci-complete:
    name: CI complete
    if: always()
    needs: [provenance, build, tests, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failures=()

          # Provenance runs on push and nowhere else. On push it must SUCCEED:
          # its step is continue-on-error, so even an unanswerable API call
          # leaves the job green with `verified` unset.
          provenance="$(jq -r '.provenance.result' <<<"$RESULTS")"
          verified="$(jq -r '.provenance.outputs.verified // ""' <<<"$RESULTS")"
          if [ "$EVENT_NAME" = push ]; then
            [ "$provenance" = success ] || failures+=("provenance did not pass on push: $provenance")
          else
            [ "$provenance" = skipped ] || failures+=("provenance ran on $EVENT_NAME: $provenance")
            verified=
          fi

          for job in build tests android; do
            result="$(jq -r --arg job "$job" '.[$job].result' <<<"$RESULTS")"
            if [ "$verified" = true ]; then
              [ "$result" = skipped ] || failures+=("$job ran on a queue-verified push: $result")
            elif [ "$result" != success ]; then
              failures+=("$job did not pass: $result")
            fi
          done

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          if [ "$verified" = true ]; then
            echo "::notice::${GITHUB_SHA} passed CI complete in the merge queue on this exact tree; build and tests were not re-run."
          else
            echo 'Every job passed.'
          fi
