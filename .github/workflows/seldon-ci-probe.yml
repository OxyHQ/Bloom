name: seldon-ci fallback experiment
# Throwaway: does a twin job in the same job-level concurrency group cancel a
# job stuck waiting for a runner that never comes, without cancelling the run?
on:
  push:
    branches: [ci/seldon-ci-probe]
permissions: {}
jobs:
  stuck:
    runs-on: seldon-ci-offline-sim
    concurrency:
      group: probe-${{ github.run_id }}-work
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - run: echo never
  wait:
    runs-on: seldon-ci
    timeout-minutes: 5
    steps:
      - run: sleep 45
  twin:
    needs: wait
    runs-on: seldon-ci
    concurrency:
      group: probe-${{ github.run_id }}-work
      cancel-in-progress: true
    timeout-minutes: 5
    steps:
      - run: echo twin ran
  complete:
    needs: [stuck, twin]
    if: always()
    runs-on: seldon-ci
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS"
