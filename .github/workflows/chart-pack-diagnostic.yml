name: Diagnostic chart package

# This workflow is for the diagnostic PR only; it never publishes or deploys.
on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Build a short-lived chart package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the diagnostic tree matches the chart candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CANDIDATE: af61ce26815fdcf3544791f95b72e476a3311cb9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          git diff --exit-code "$CANDIDATE" HEAD -- . ':!.github/workflows/chart-pack-diagnostic.yml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Verify generated sources match the candidate
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Pack and record the source and SHA-512
        env:
          CANDIDATE: af61ce26815fdcf3544791f95b72e476a3311cb9
          PACK_DIRECTORY: ${{ runner.temp }}/chart-pack
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DIRECTORY"
          bun pm pack --ignore-scripts --quiet --destination "$PACK_DIRECTORY"
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const { execFileSync } = require('node:child_process');
          const directory = process.env.PACK_DIRECTORY;
          const files = readdirSync(directory).filter((name) => name.endsWith('.tgz'));
          if (files.length !== 1) throw new Error(`expected one tarball, got ${files.length}`);
          const digest = createHash('sha512').update(readFileSync(join(directory, files[0]))).digest('base64');
          const manifest = {
            candidate: process.env.CANDIDATE,
            diagnosticHead: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            tarball: files[0],
            integrity: `sha512-${digest}`,
          };
          writeFileSync(join(directory, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(JSON.stringify(manifest));
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chart-pack/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
