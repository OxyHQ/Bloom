android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ActiveProcessorCount=2
reactNativeArchitectures=arm64-v8a
kotlin.daemon.jvmargs=-Xmx1g -XX:ActiveProcessorCount=2
# Try a dependency request that timed out or got 408, 429 or 5xx up to six times,
# waiting 2 s and doubling (62 s in all), before Gradle gives up on the repository
# for the build; the default (3 tries, 1 s) lost to Maven Central rate limits.
# Read by Gradle 8.3 and 9.4.1 (ErrorHandlingModuleComponentRepository).
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
