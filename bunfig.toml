[install]
# Supply-chain quarantine. A compromised release is typically caught and
# unpublished within hours to a couple of days, so refusing to RESOLVE anything
# published in the last week removes most of that window. Bloom's tree is almost
# entirely third-party (React Native, Expo, Storybook), which is exactly the
# surface this protects.
#
# It applies to resolution only, never to a frozen install: `bun install
# --frozen-lockfile` installs an already-locked fresh package with no complaint
# even on a cold manifest cache. So it fires for whoever adds or bumps a
# dependency here — the moment the decision is actually made — and not for
# anyone reproducing bun.lock. Override deliberately, for a fix you have reason
# to take immediately, with `bun install --minimum-release-age=0`.
#
# First-party packages are exempt: the quarantine guards against a freshly
# compromised THIRD-PARTY release, and publishing an Oxy package then bumping
# its consumer in the same session is the normal workflow. Bun matches
# `minimumReleaseAgeExcludes` by EXACT name (a scope glob such as "@oxy.so/*"
# is accepted and silently matches nothing), so the list names every published
# first-party package: the same list in every Oxy repo with the quarantine.
# `scripts/check-release-age-excludes.mjs` (run in CI) fails if bun.lock
# resolves a first-party package the list misses, or if the list names a glob
# or anything outside the first-party scopes. A newly published first-party
# package is added here in each of those repos.
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "@alia-codea/cli",
  "@alia.onl/sdk",
  "@alia.onl/server",
  "@clarity.surf/sdk",
  "@crowdsource.you/contracts",
  "@crowdsource.you/core",
  "@fairco.in/core",
